[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fishgen"
version = "0.1.0"
description = "Procedural pixel-art fish generator with seamless swim and turn-around animations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
preview = ["pygame-ce>=2.4"]
dev = ["pytest>=7"]

[project.scripts]
fishgen = "fishgen.cli:main"

[tool.setuptools.packages.find]
include = ["fishgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
