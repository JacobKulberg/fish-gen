[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fishgen"
version = "0.1.0"
description = "Procedural pixel-art fish, sharks, whales, rays and more, with seamless swim and turn-around animations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jacob Kulberg" }]
keywords = ["pixel-art", "procedural-generation", "sprites", "gamedev", "godot", "fish", "animation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
]
dependencies = ["numpy>=1.24", "pillow>=10"]

[project.optional-dependencies]
preview = ["pygame-ce>=2.4"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/JacobKulberg/fish-gen"
Issues = "https://github.com/JacobKulberg/fish-gen/issues"

[project.scripts]
fishgen = "fishgen.cli:main"

[tool.setuptools.packages.find]
include = ["fishgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
